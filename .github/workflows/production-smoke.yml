name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live production checks
        env:
          BASE_URL: https://opportunityradar.shudipto1113.workers.dev
        run: node scripts/production-smoke.mjs
