<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OpportunityRadar Production Smoke Test</title><style>body{font-family:system-ui;margin:0;background:#f7f8fb;color:#101828}.wrap{max-width:900px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #eaecf0;border-radius:14px;padding:16px;margin:10px 0}.pass{border-left:5px solid #067647}.fail{border-left:5px solid #b42318}code{word-break:break-all}.muted{color:#667085}</style></head><body><div class="wrap"><h1>Production Smoke Test</h1><p class="muted">This page tests the live deployment from the browser that opens it.</p><div id="results"></div><script>(async()=>{const out=document.getElementById('results');const tests=[];const add=(name,ok,detail='')=>tests.push({name,ok,detail});try{const r=await fetch('/api/health',{cache:'no-store'});const j=await r.json();add('Health endpoint',r.ok&&j.status==='online',JSON.stringify(j));}catch(e){add('Health endpoint',false,String(e))}try{const r=await fetch('/api/opportunities',{cache:'no-store'});const j=await r.json();add('Opportunity API',r.ok&&Array.isArray(j.opportunities),`count=${j.count}`);const first=j.opportunities?.[0];add('First record passes server publication',!!first&&first.status==='open'&&first.official_url&&first.verified_at,first?first.title:'none');}catch(e){add('Opportunity API',false,String(e))}try{const r=await fetch('/');const t=await r.text();add('Homepage served',r.ok&&t.includes('Find my matches')&&t.includes('CHECKED BEFORE RECOMMENDATION'));}catch(e){add('Homepage served',false,String(e))}try{const r=await fetch('/robots.txt');add('robots.txt',r.ok&&r.text?true:false);}catch(e){add('robots.txt',false,String(e))}try{const r=await fetch('/sitemap.xml');const t=await r.text();add('sitemap.xml',r.ok&&t.includes('opportunityradar.shudipto1113.workers.dev'));}catch(e){add('sitemap.xml',false,String(e))}out.innerHTML=tests.map(x=>`<div class="card ${x.ok?'pass':'fail'}"><strong>${x.ok?'PASS':'FAIL'} — ${x.name}</strong><div class="muted">${String(x.detail||'')}</div></div>`).join('')+`<div class="card"><b>Result:</b> ${tests.filter(x=>x.ok).length}/${tests.length} passed.</div>`})();</script></div></body></html>
