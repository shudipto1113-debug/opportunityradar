<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpportunityRadar</title><style>body{font-family:system-ui;margin:0;background:#f7f8fb;color:#101828}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.controls{display:grid;grid-template-columns:1fr 1fr 2fr 1fr;gap:8px}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:10px}button{margin-top:8px;padding:11px 14px;background:#101828;color:#fff;border:0;border-radius:10px;font-weight:700}.muted{color:#667085;font-size:14px}.tag{display:inline-block;background:#f2f4f7;padding:4px 7px;border-radius:999px;font-size:11px;margin:2px}.match{color:#067647;font-weight:900;font-size:12px}.note{background:#f8fafc;border:1px dashed #d0d5dd;border-radius:10px;padding:9px;font-size:12px;line-height:1.4;margin:9px 0}.open{display:block;text-align:center;background:#101828;color:#fff;text-decoration:none;padding:10px;border-radius:10px;font-weight:800}</style></head><body><div class="wrap"><h1>OpportunityRadar</h1><p class="muted">Verified opportunities with official source links, deadlines and eligibility notes. Data checked 17 Aug 2026.</p><section class="card"><div class="controls"><input id="q" placeholder="Search AI, Python, IoT..."><select id="kind"><option value="">All types</option><option>Hackathon</option></select><input id="skills" placeholder="Your skills: AI, Python"><select id="sort"><option value="match">Best match</option><option value="deadline">Deadline soon</option><option value="prize">Cash prize high → low</option></select></div><div class="controls" style="margin-top:8px"><input id="country" placeholder="Country"><input id="age" type="number" placeholder="Age"><select id="student"><option value="">Student?</option><option value="yes">Yes</option><option value="no">No</option></select><button id="apply">Update matches</button></div><p id="count" class="muted"></p></section><main id="grid" class="grid"></main><p class="muted">Official source is authoritative. Match score is guidance, not a guarantee of eligibility.</p></div><script>
const D=[
['CockroachDB × AWS Hackathon — Build with Agentic Memory','https://cockroachdb-ai.devpost.com/rules','2026-08-18T17:00:00-04:00',8750,2621,18,0,['AI','AI Agents','Databases','AWS','DevOps'],'Global; standard exceptions','18+ or age of majority; teams up to 5 and organizations may enter','Prize is $5,000 + $2,500 + $1,250 cash.'],
['NeuralSprint','https://neuralsprint.devpost.com/','2026-08-23T23:45:00-07:00',150,322,18,1,['AI','Machine Learning','Web Development','Social Good'],'Global; standard exceptions','Above legal age of majority; students only; companies/professional organizations excluded','$150 cash for Best Overall plus other awards.'],
['Africa Deep Tech Challenge 2026 — The Laptop LLM Challenge','https://adtc-2026.devpost.com/','2026-08-24T23:45:00-07:00',16500,1224,18,0,['AI','Machine Learning','LLM','On-device AI','Python'],'Specific African countries only','Only listed African countries; above legal age of majority','$8,000 + $4,000 + $3,000 + $1,500 cash, plus GPU-credit stipends.'],
['AI Builders Hackathon','https://ai-builders-hackathon-2026.devpost.com/rules','2026-08-25T23:59:00-07:00',4000,909,18,1,['AI','AI Agents','Machine Learning','Python','Web Development'],'Global; standard exceptions','Students only; above legal age of majority; companies/professional organizations excluded','$4,000 Best SaaS Product cash prize.'],
['VoltHacks — Design. Build. Power the Future.','https://volthacks.devpost.com/','2026-09-05T17:00:00-04:00',2685,881,13,1,['IoT','AI','Machine Learning','Hardware','Robotics'],'Global; standard exceptions','Ages 13+; students only; companies/professional organizations excluded','Page advertises $32,585+ total prizes, but explicit cash components total $2,685; the rest is non-cash.']
];
let P={country:'',age:0,student:'',skills:[]}; const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const days=d=>Math.ceil((new Date(d)-Date.now())/86400000);
function read(){P.country=q('#country').value.toLowerCase();P.age=+q('#age').value||0;P.student=q('#student').value;P.skills=q('#skills').value.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean)}function q(s){return document.querySelector(s)}function score(x){let s=50,w=[];const global=x[7].toLowerCase().includes('global');if(P.country&&global){s+=18;w.push('global geography')}if(P.country&&!global){s-=30;w.push('country restriction — verify official list')}if(P.age){if(P.age>=x[5]){s+=10;w.push('age fits')}else{s-=35;w.push('below minimum age')}}if(P.student==='yes'&&x[6]){s+=12;w.push('student match')}if(P.student==='no'&&x[6]){s-=35;w.push('students only')}const h=x[8].join(' ').toLowerCase(),hits=P.skills.filter(k=>h.includes(k)).length;if(hits){s+=Math.min(20,hits*6);w.push('skills match')}return[Math.max(1,Math.min(99,Math.round(s))),w]}
function render(){read();const term=q('#q').value.toLowerCase(),kind=q('#kind').value,sort=q('#sort').value;let rows=D.map(x=>{const [s,w]=score(x);return{x,s,w}}).filter(r=>(!term||[r.x[0],...r.x[8]].join(' ').toLowerCase().includes(term))).sort((a,b)=>sort==='deadline'?days(a.x[2])-days(b.x[2]):sort==='prize'?b.x[3]-a.x[3]:b.s-a.s);q('#count').textContent=rows.length+' result'+(rows.length===1?'':'s');q('#grid').innerHTML=rows.map(r=>{const x=r.x,l=days(x[2]);return `<article class="card"><div><b>Hackathon · Devpost</b> <span class="match">${r.s}% match</span></div><h2>${esc(x[0])}</h2><b>${x[3].toLocaleString('en-US',{style:'currency',currency:'USD'})} explicitly listed cash</b><p class="muted">${l<0?'Deadline passed':l===0?'Due today':l+' days left'} · ${new Date(x[2]).toLocaleString()}</p><div>${x[8].map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</div><div class="note"><b>Eligibility:</b> ${esc(x[9])}<br><br><b>Why this match:</b> ${esc(r.w.join(' · ')||'Add your profile to improve matching.')}<br><br><b>Accuracy note:</b> ${esc(x[10])}<br><br><b>Observed participants:</b> ${x[4].toLocaleString()}</div><a class="open" href="${esc(x[1])}" target="_blank" rel="noopener">Open official source ↗</a></article>`}).join('')||'<div class="card">No results.</div>'}['q','kind','sort','skills','country','age','student'].forEach(id=>q('#'+id).addEventListener('input',render));q('#apply').addEventListener('click',render);render();
</script></body></html>
