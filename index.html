<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpportunityRadar — Find opportunities that fit you</title><meta name="description" content="A source-first opportunity finder for grants, competitions, hackathons and fellowships."></head><body><div id="app">Loading OpportunityRadar…</div><script>
let DATA=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const css=`body{font-family:system-ui;margin:0;background:#f8fafc;color:#101828}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.controls{display:grid;grid-template-columns:1fr 1fr 2fr 1fr;gap:8px}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:10px}button{padding:11px 14px;background:#111827;color:white;border:0;border-radius:10px;font-weight:700}a{color:#111827;font-weight:700}.muted{color:#667085;font-size:14px}.tag{display:inline-block;background:#f2f4f7;padding:4px 7px;border-radius:999px;font-size:11px;margin:2px}`;
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:css}));
function render(){const q=document.querySelector('#q').value.toLowerCase(),k=document.querySelector('#kind').value,st=document.querySelector('#status').value;let rows=DATA.filter(o=>{const hay=[o.title,o.kind,o.summary,...(o.skills||[])].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!k||o.kind===k)&&(!st||o.status===st)});document.querySelector('#count').textContent=rows.length+' result'+(rows.length===1?'':'s');document.querySelector('#grid').innerHTML=rows.map(o=>`<article class="card"><div><b>${esc(o.kind)} · ${esc(o.source_id)}</b></div><h2>${esc(o.title)}</h2><p>${esc(o.summary)}</p><p><b>Status:</b> ${esc(o.status)} · <b>Verified:</b> ${esc(o.verified_at)}</p><div>${(o.skills||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')}</div><p><a href="${esc(o.official_url)}" target="_blank" rel="noopener">Open official source ↗</a></p></article>`).join('')||'<div class="card">No matching opportunities.</div>';}
Promise.all([fetch('seed.json').then(r=>r.json()),fetch('sources.json').then(r=>r.json())]).then(([seed,sources])=>{DATA=seed.map(x=>({...x,source_id:sources.find(s=>s.id===x.source_id)?.name||x.source_id}));document.querySelector('#app').innerHTML=`<div class="wrap"><h1>OpportunityRadar</h1><p class="muted">Find opportunities you can actually apply for.</p><div class="card"><div class="controls"><input id="q" placeholder="Search AI, grants, hackathons…"><select id="kind"><option value="">All types</option><option>Grant</option><option>Hackathon</option><option>Competition</option><option>Fellowship</option></select><input id="profile" placeholder="Your skills, e.g. AI, Python, research"><select id="status"><option value="">All available</option><option value="open">Open / live</option><option value="seed">Seed / preview</option></select></div><p id="count" class="muted"></p></div><div id="grid" class="grid"></div><p class="muted">Always verify eligibility, deadlines and rules on the official source.</p></div>`;['q','kind','status'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render));render();}).catch(()=>{document.querySelector('#app').innerHTML='<div class="wrap"><div class="card">Could not load the preview data. Serve this folder through a web server instead of opening the HTML file directly.</div></div>';});
</script></body></html>
