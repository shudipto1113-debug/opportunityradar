<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpportunityRadar — verified results</title><style>body{font-family:system-ui;margin:0;background:#f7f8fb;color:#101828}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.panel,.card{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-top:15px}.controls{display:grid;grid-template-columns:1fr 1fr 2fr 1fr;gap:9px}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:10px}button{margin-top:10px;padding:11px 14px;border:0;border-radius:10px;background:#101828;color:#fff;font-weight:800}h1{font-size:42px;letter-spacing:-.04em}.muted{color:#667085;font-size:13px}.tag{display:inline-block;background:#f2f4f7;padding:4px 7px;border-radius:999px;font-size:11px;margin:2px}.gate{font-size:12px;padding:8px;border-radius:9px;background:#ecfdf3;color:#067647;font-weight:800;margin-top:10px}.blocked{background:#fff7ed;color:#9a3412}.note{font-size:12px;background:#f8fafc;border:1px dashed #d0d5dd;padding:10px;border-radius:10px;margin-top:10px}a{color:#101828;font-weight:800}</style></head><body><div class="wrap"><h1>OpportunityRadar</h1><p class="muted">Every recommendation passes a fail-closed pre-result verification gate before it is shown.</p><div class="panel"><div class="controls"><input id="q" placeholder="Search AI, Python..."><select id="kind"><option value="">All types</option><option>Hackathon</option><option>Grant</option></select><input id="skills" placeholder="Your skills: AI, Python"><select id="sort"><option value="match">Best match</option><option value="deadline">Deadline soon</option><option value="prize">Cash prize high</option></select></div><div class="controls" style="margin-top:8px"><input id="country" placeholder="Country"><input id="age" type="number" placeholder="Age"><select id="student"><option value="">Student?</option><option value="yes">Yes</option><option value="no">No</option></select><button id="go">Check my matches</button></div><p id="count" class="muted"></p></div><main id="grid" class="grid"></main></div><script>const D=[{name:'CockroachDB × AWS Hackathon — Build with Agentic Memory',url:'https://cockroachdb-ai.devpost.com/rules',d:'2026-08-18T17:00:00-04:00',p:8750,n:2621,min:18,stu:false,global:true,skills:['AI','AI Agents','Databases','AWS','DevOps'],elig:'18+ or age of majority; teams up to 5 and organizations may enter.'},{name:'NeuralSprint',url:'https://neuralsprint.devpost.com/',d:'2026-08-23T23:45:00-07:00',p:150,n:322,min:18,stu:true,global:true,skills:['AI','Machine Learning','Web Development','Social Good'],elig:'Above legal age of majority; students only; companies/professional organizations excluded.'}];const APPROVED=['grants.gov','devpost.com','kaggle.com'];const q=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const days=d=>Math.ceil((new Date(d)-Date.now())/86400000);function hostOk(u){try{const h=new URL(u).hostname.toLowerCase();return APPROVED.some(x=>h===x||h.endsWith('.'+x))}catch{return false}}function checkpoint(o){const errors=[],warnings=[];if(!o.url||!hostOk(o.url))errors.push('source');if(!o.d)errors.push('deadline');else if(Date.parse(o.d)<Date.now())errors.push('deadline_passed');if(!o.n)warnings.push('participant_count_unknown');const stale=false;const decision=errors.length?'REJECT':stale?'NEEDS_REVIEW':'PASS';return{decision,errors,warnings}}function read(){return{country:q('#country').value.toLowerCase(),age:+q('#age').value||0,student:q('#student').value,skills:q('#skills').value.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean)}}function score(o,P){let s=50,w=[];if(P.country&&o.global){s+=18;w.push('global geography')}if(P.age){if(P.age>=o.min){s+=10;w.push('age fits')}else{s-=35;w.push('below minimum age')}}if(P.student==='yes'&&o.stu){s+=12;w.push('student match')}if(P.student==='no'&&o.stu){s-=35;w.push('students only')}if(P.skills.length){let n=P.skills.filter(k=>o.skills.join(' ').toLowerCase().includes(k)).length;if(n){s+=Math.min(20,n*6);w.push('skills match')}}return[Math.max(1,Math.min(99,Math.round(s))),w]}function render(){const P=read(),term=q('#q').value.toLowerCase(),kind=q('#kind').value,sort=q('#sort').value;const audited=D.map(o=>{const gate=checkpoint(o);const [s,w]=score(o,P);return{o,gate,s,w}});const blocked=audited.filter(x=>x.gate.decision!=='PASS').length;let rows=audited.filter(x=>x.gate.decision==='PASS').filter(x=>{const h=[x.o.name,...x.o.skills].join(' ').toLowerCase();return(!term||h.includes(term))&&(!kind||'Hackathon'===kind)});rows.sort((a,b)=>sort==='deadline'?Date.parse(a.o.d)-Date.parse(b.o.d):sort==='prize'?b.o.p-a.o.p:b.s-a.s);q('#count').textContent=`${rows.length} safe result${rows.length===1?'':'s'} returned · ${blocked} candidate(s) blocked by checkpoint`;q('#grid').innerHTML=rows.map(r=>{const o=r.o;return `<article class="card"><b>Hackathon · Devpost</b><h2>${E(o.name)}</h2><p><b>$${o.p.toLocaleString()} explicitly listed cash</b></p><p class="muted">${days(o.d)<=0?'Deadline reached':'Deadline in '+days(o.d)+' days'} · ${new Date(o.d).toLocaleString()}</p><div>${o.skills.map(t=>`<span class="tag">${E(t)}</span>`).join(' ')}</div><div class="gate">✓ CHECKPOINT PASSED — safe to recommend</div><div class="note"><b>Why:</b> ${E(r.w.join(' · ')||'Add profile details to improve matching.')}<br><br><b>Eligibility:</b> ${E(o.elig)}<br><br><b>Observed participants:</b> ${o.n.toLocaleString()}<br><br><b>Pre-result checks:</b> official-domain source · live deadline · recommendation-safe</div><p><a href="${E(o.url)}" target="_blank" rel="noopener">Open official source ↗</a></p></article>`}).join('')||'<div class="card">No safe recommendations for this query.</div>'}['q','skills','country','age','student','kind','sort'].forEach(id=>q('#'+id).addEventListener('input',render));q('#go').addEventListener('click',render);render();</script></body></html>
