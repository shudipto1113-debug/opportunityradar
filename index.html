<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpportunityRadar</title><style>body{font:16px system-ui;margin:0;background:#f7f8fb;color:#101828}.wrap{max-width:1050px;margin:auto;padding:25px 15px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr 2fr 1fr;gap:8px}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}}input,select{padding:11px;border:1px solid #ccc;border-radius:9px}button{margin-top:8px;padding:11px 14px;background:#101828;color:#fff;border:0;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.muted{color:#667085;font-size:14px}.tag{display:inline-block;background:#eee;padding:3px 7px;border-radius:999px;font-size:11px;margin:2px}.match{float:right;color:#067647;font-weight:800}.note{background:#f8fafc;border:1px dashed #ccc;border-radius:9px;padding:9px;font-size:12px;line-height:1.4}.open{display:block;margin-top:10px;text-align:center;background:#101828;color:#fff;padding:10px;border-radius:9px;text-decoration:none;font-weight:700}</style></head><body><div class="wrap"><h1>OpportunityRadar</h1><p class="muted">Verified opportunities. Official source checked 17 Aug 2026. Match scores are guidance, not guarantees.</p><section class="card"><div class="controls"><input id="q" placeholder="Search AI, Python, IoT..."><select id="kind"><option value="">All types</option><option>Hackathon</option></select><input id="skills" placeholder="Skills: AI, Python"><select id="sort"><option value="match">Best match</option><option value="deadline">Deadline soon</option><option value="prize">Cash prize high</option></select></div><div class="controls" style="margin-top:8px"><input id="country" placeholder="Country"><input id="age" type="number" placeholder="Age"><select id="student"><option value="">Student?</option><option value="yes">Yes</option><option value="no">No</option></select><button id="go">Update matches</button></div><p id="count" class="muted"></p></section><main id="grid" class="grid"></main></div><script>
const D=[
{name:'CockroachDB × AWS Hackathon — Build with Agentic Memory',url:'https://cockroachdb-ai.devpost.com/rules',d:'2026-08-18T17:00:00-04:00',p:8750,n:2621,min:18,stu:false,global:true,skills:['AI','AI Agents','Databases','AWS','DevOps'],elig:'18+ or age of majority; teams up to 5 and organizations may enter.',note:'Official rules: $5,000 + $2,500 + $1,250 cash.'},
{name:'NeuralSprint',url:'https://neuralsprint.devpost.com/',d:'2026-08-23T23:45:00-07:00',p:150,n:322,min:18,stu:true,global:true,skills:['AI','Machine Learning','Web Development','Social Good'],elig:'Above legal age of majority; students only; companies/professional organizations excluded.',note:'Official page: $150 cash for Best Overall plus other awards.'},
{name:'Africa Deep Tech Challenge 2026 — The Laptop LLM Challenge',url:'https://adtc-2026.devpost.com/',d:'2026-08-24T23:45:00-07:00',p:16500,n:1224,min:18,stu:false,global:false,skills:['AI','Machine Learning','LLM','On-device AI','Python'],elig:'Only listed African countries; above legal age of majority.',note:'Official page: $8,000 + $4,000 + $3,000 + $1,500 cash, plus GPU-credit stipends.'},
{name:'AI Builders Hackathon',url:'https://ai-builders-hackathon-2026.devpost.com/rules',d:'2026-08-25T23:59:00-07:00',p:4000,n:909,min:18,stu:true,global:true,skills:['AI','AI Agents','Machine Learning','Python','Web Development'],elig:'Students only; above legal age of majority; companies/professional organizations excluded.',note:'Official rules: $4,000 Best SaaS Product cash prize.'},
{name:'VoltHacks — Design. Build. Power the Future.',url:'https://volthacks.devpost.com/',d:'2026-09-05T17:00:00-04:00',p:2685,n:881,min:13,stu:true,global:true,skills:['IoT','AI','Machine Learning','Hardware','Robotics'],elig:'Ages 13+; students only; companies/professional organizations excluded.',note:'Page advertises $32,585+ total prizes; explicit cash components add to $2,685, with the rest non-cash.'}
];
const q=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const days=d=>Math.ceil((new Date(d)-Date.now())/86400000);let P={};
function read(){P={country:q('#country').value.toLowerCase(),age:+q('#age').value||0,student:q('#student').value,skills:q('#skills').value.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean)}}
function score(o){let s=50,w=[];if(P.country&&o.global){s+=18;w.push('global geography')}if(P.country&&!o.global){s-=30;w.push('country restriction — verify official list')}if(P.age){P.age>=o.min?s+=10:(s-=35,w.push('below minimum age'));if(P.age>=o.min)w.push('age fits')}if(P.student==='yes'&&o.stu){s+=12;w.push('student match')}if(P.student==='no'&&o.stu){s-=35;w.push('students only')}if(P.skills.length){let n=P.skills.filter(k=>o.skills.join(' ').toLowerCase().includes(k)).length;if(n){s+=Math.min(20,n*6);w.push('skills match')}}return[Math.max(1,Math.min(99,Math.round(s))),w]}
function render(){read();let term=q('#q').value.toLowerCase(),sort=q('#sort').value,rows=D.map(o=>{let [s,w]=score(o);return{o,s,w}}).filter(r=>!term||[r.o.name,...r.o.skills].join(' ').toLowerCase().includes(term));rows.sort((a,b)=>sort==='deadline'?days(a.o.d)-days(b.o.d):sort==='prize'?b.o.p-a.o.p:b.s-a.s);q('#count').textContent=rows.length+' result'+(rows.length===1?'':'s');q('#grid').innerHTML=rows.map(r=>{let o=r.o,l=days(o.d);return `<article class="card"><b>${E(o.name)}</b><span class="match">${r.s}% match</span><p><b>$${o.p.toLocaleString()} explicitly listed cash</b></p><p class="muted">${l<=0?'Deadline reached':'Deadline in '+l+' days'} · ${new Date(o.d).toLocaleString()}</p><div>${o.skills.map(t=>`<span class="tag">${E(t)}</span>`).join(' ')}</div><div class="note"><b>Eligibility:</b> ${E(o.elig)}<br><br><b>Why:</b> ${E(r.w.join(' · ')||'Add profile details to improve matching.')}<br><br><b>Accuracy note:</b> ${E(o.note)}<br><br><b>Observed participants:</b> ${o.n.toLocaleString()}</div><a class="open" href="${E(o.url)}" target="_blank" rel="noopener">Open official source ↗</a></article>`}).join('')||'<div class="card">No results. Try a broader search.</div>'}
['q','skills','country','age','student','sort'].forEach(id=>q('#'+id).addEventListener('input',render));q('#go').addEventListener('click',render);render();
</script></body></html>
